[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "saereg_ml"
version = "0.1.0"
description = "Python stages of the R package saereg: embeddings, sparse autoencoder, labels"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pyarrow", "pyyaml", "torch", "hypothesaes==2.0.0", "tiktoken", "openai"]

[tool.setuptools]
packages = ["saereg_ml"]
